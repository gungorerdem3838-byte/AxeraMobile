name: Build Axera Mobile Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download & Patch ARM64 JRE for Android Bionic
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf xz-utils zip

          mkdir -p app/src/main/assets/jre_data
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p temp_jre

          echo "ARM64 OpenJDK 8 indiriliyor..."
          curl -L "https://download.bell-sw.com/java/8u402+7/bellsoft-jre8u402+7-linux-aarch64.tar.gz" -o jre8.tar.gz
          tar -xzf jre8.tar.gz -C temp_jre --strip-components=1
          rm -f jre8.tar.gz

          # 1. Interpreter'ı Android linker64 yap ve RPATH'i temizle
          patchelf --set-interpreter /system/bin/linker64 temp_jre/bin/java || true
          patchelf --remove-rpath temp_jre/bin/java || true

          # 2. Glibc kütüphane isimlerini doğrudan Android Bionic karşılıklarına yamala
          for binfile in temp_jre/bin/java $(find temp_jre/lib -name "*.so"); do
              patchelf --remove-rpath "$binfile" 2>/dev/null || true
              patchelf --replace-needed libpthread.so.0 libc.so "$binfile" 2>/dev/null || true
              patchelf --replace-needed librt.so.1 libc.so "$binfile" 2>/dev/null || true
              patchelf --replace-needed libc.so.6 libc.so "$binfile" 2>/dev/null || true
              patchelf --replace-needed libdl.so.2 libdl.so "$binfile" 2>/dev/null || true
              patchelf --replace-needed libm.so.6 libm.so "$binfile" 2>/dev/null || true
              patchelf --replace-needed ld-linux-aarch64.so.1 ld-android.so "$binfile" 2>/dev/null || true
          done

          # 3. Java yürütülebilir dosyasını ve .so kütüphanelerini jniLibs içine taşı
          cp temp_jre/bin/java app/src/main/jniLibs/arm64-v8a/libjava_exec.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libjava_exec.so

          find temp_jre/lib -name "*.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;

          # 4. Kalan JRE runtime dosyalarını (rt.jar vb.) zip olarak assets içine göm
          cd temp_jre
          zip -r -q ../app/src/main/assets/jre_data/jre_runtime.zip lib
          cd ..
          rm -rf temp_jre

      - name: Generate Project Structure & Code
        run: |
          mkdir -p app/src/main/java/com/axera/launcher
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AxeraMobile"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.axera.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId "com.axera.launcher"
                  minSdk 24
                  targetSdk 34
                  versionCode 8
                  versionName "1.7-Axera"
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
                  doNotStrip "**/*.so"
              }

              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {}
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="Axera Launcher"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. CoreMotor.kt
          cat << 'EOF' > app/src/main/java/com/axera/launcher/CoreMotor.kt
          package com.axera.launcher

          import android.content.Context
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.zip.ZipInputStream

          class CoreMotor(
              private val context: Context,
              private val logger: (String) -> Unit,
              private val onProgress: (Int, String) -> Unit
          ) {

              val mcDir = File(context.filesDir, ".minecraft")
              val versionsDir = File(mcDir, "versions")
              val librariesDir = File(mcDir, "libraries")
              val assetsDir = File(mcDir, "assets")
              val nativesDir = File(mcDir, "natives")
              val jreDir = File(context.filesDir, "runtime/jre")

              init {
                  listOf(mcDir, versionsDir, librariesDir, assetsDir, nativesDir, jreDir).forEach {
                      if (!it.exists()) it.mkdirs()
                  }
              }

              fun ensureEmbeddedJreReady(): Boolean {
                  val rtJar = File(jreDir, "lib/rt.jar")
                  val nativeDir = File(context.applicationInfo.nativeLibraryDir)
                  val javaExec = File(nativeDir, "libjava_exec.so")

                  if (!javaExec.exists()) {
                      logger("HATA: Gömülü Java motoru bulunamadı (${javaExec.absolutePath})")
                      return false
                  }

                  val aarch64Dir = File(jreDir, "lib/aarch64").apply { mkdirs() }
                  val jliDir = File(aarch64Dir, "jli").apply { mkdirs() }
                  val serverDir = File(aarch64Dir, "server").apply { mkdirs() }

                  if (!rtJar.exists()) {
                      try {
                          onProgress(20, "Gömülü Bionic ARM64 JRE çıkartılıyor...")
                          logger("APK içindeki yamalı ARM64 JRE çıkartılıyor...")

                          context.assets.open("jre_data/jre_runtime.zip").use { input ->
                              ZipInputStream(input).use { zis ->
                                  var entry = zis.nextEntry
                                  while (entry != null) {
                                      val outFile = File(jreDir, entry.name)
                                      if (entry.isDirectory) {
                                          outFile.mkdirs()
                                      } else {
                                          outFile.parentFile?.mkdirs()
                                          FileOutputStream(outFile).use { fos ->
                                              zis.copyTo(fos)
                                          }
                                      }
                                      zis.closeEntry()
                                      entry = zis.nextEntry
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          logger("Gömülü JRE Çıkartma Hatası: ${e.message}")
                          onProgress(0, "JRE Hatası!")
                          return false
                      }
                  }

                  nativeDir.listFiles()?.forEach { soFile ->
                      if (soFile.name.endsWith(".so") && soFile.name != "libjava_exec.so") {
                          try {
                              Runtime.getRuntime().exec(arrayOf("ln", "-sf", soFile.absolutePath, File(aarch64Dir, soFile.name).absolutePath)).waitFor()
                              if (soFile.name == "libjli.so") {
                                  Runtime.getRuntime().exec(arrayOf("ln", "-sf", soFile.absolutePath, File(jliDir, soFile.name).absolutePath)).waitFor()
                              }
                              if (soFile.name == "libjvm.so") {
                                  Runtime.getRuntime().exec(arrayOf("ln", "-sf", soFile.absolutePath, File(serverDir, soFile.name).absolutePath)).waitFor()
                              }
                          } catch (_: Exception) {}
                      }
                  }

                  onProgress(55, "ELF Yamalı JRE Hazır!")
                  return rtJar.exists()
              }

              fun prepareVersion(versionId: String): Boolean {
                  return try {
                      onProgress(2, "Mojang manifest çekiliyor...")
                      logger("Mojang sunucularına bağlanılıyor ($versionId)...")
                      val manifestJson = fetchString("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
                      val versions = JSONObject(manifestJson).getJSONArray("versions")
                      
                      var versionUrl: String? = null
                      for (i in 0 until versions.length()) {
                          val v = versions.getJSONObject(i)
                          if (v.getString("id") == versionId) {
                              versionUrl = v.getString("url")
                              break
                          }
                      }

                      if (versionUrl == null) {
                          logger("HATA: Sürüm bulunamadı!")
                          onProgress(0, "Hata: Sürüm bulunamadı")
                          return false
                      }

                      onProgress(8, "$versionId JSON okunuyor...")
                      val vDir = File(versionsDir, versionId).apply { mkdirs() }
                      val vJsonFile = File(vDir, "$versionId.json")
                      val vJsonStr = fetchString(versionUrl)
                      vJsonFile.writeText(vJsonStr)

                      val vObj = JSONObject(vJsonStr)
                      
                      val clientUrl = vObj.getJSONObject("downloads").getJSONObject("client").getString("url")
                      val clientJar = File(vDir, "$versionId.jar")
                      if (!clientJar.exists()) {
                          onProgress(15, "$versionId.jar indiriliyor...")
                          logger("$versionId.jar indiriliyor...")
                          downloadFile(clientUrl, clientJar)
                      }

                      val libs = vObj.getJSONArray("libraries")
                      val validLibs = mutableListOf<JSONObject>()
                      for (i in 0 until libs.length()) {
                          val lib = libs.getJSONObject(i)
                          if (!isLibAllowed(lib)) continue
                          val artifact = lib.optJSONObject("downloads")?.optJSONObject("artifact") ?: continue
                          validLibs.add(artifact)
                      }

                      val totalLibs = validLibs.size.coerceAtLeast(1)
                      var downloadedCount = 0

                      for ((index, artifact) in validLibs.withIndex()) {
                          val path = artifact.getString("path")
                          val url = artifact.getString("url")
                          val libFile = File(librariesDir, path)

                          val currentPercent = 15 + (((index + 1) * 85) / totalLibs)
                          onProgress(currentPercent, "Kütüphane (${index + 1}/$totalLibs): ${libFile.name}")

                          if (!libFile.exists()) {
                              libFile.parentFile?.mkdirs()
                              logger("İndiriliyor: ${libFile.name}")
                              downloadFile(url, libFile)
                              downloadedCount++
                          }
                      }

                      onProgress(100, "$versionId Hazır! ($downloadedCount yeni dosya)")
                      logger("Kurulum tamamlandı! Toplam $totalLibs kütüphane doğrulandı.")
                      true
                  } catch (e: Exception) {
                      logger("İndirme Hatası: ${e.message}")
                      onProgress(0, "İndirme Hatası!")
                      false
                  }
              }

              private fun isLibAllowed(lib: JSONObject): Boolean {
                  val rules = lib.optJSONArray("rules") ?: return true
                  var allow = false
                  for (i in 0 until rules.length()) {
                      val rule = rules.getJSONObject(i)
                      val action = rule.getString("action") == "allow"
                      val os = rule.optJSONObject("os")
                      if (os == null || os.optString("name") == "linux") {
                          allow = action
                      }
                  }
                  return allow
              }

              private fun buildClasspath(versionId: String, vObj: JSONObject): String {
                  val cp = StringBuilder()
                  val libs = vObj.getJSONArray("libraries")
                  for (i in 0 until libs.length()) {
                      val lib = libs.getJSONObject(i)
                      if (!isLibAllowed(lib)) continue
                      val artifact = lib.optJSONObject("downloads")?.optJSONObject("artifact") ?: continue
                      val libFile = File(librariesDir, artifact.getString("path"))
                      if (libFile.exists()) {
                          cp.append(libFile.absolutePath).append(":")
                      }
                  }
                  val clientJar = File(File(versionsDir, versionId), "$versionId.jar")
                  cp.append(clientJar.absolutePath)
                  return cp.toString()
              }

              fun launchGame(username: String, versionId: String, maxRamMb: Int) {
                  try {
                      val vJsonFile = File(File(versionsDir, versionId), "$versionId.json")
                      if (!vJsonFile.exists()) {
                          logger("HATA: Önce '1. Sürümü ve Kütüphaneleri İndir' butonuna basmalısın!")
                          onProgress(0, "Sürüm indirilmemiş!")
                          return
                      }

                      if (!ensureEmbeddedJreReady()) {
                          return
                      }

                      onProgress(70, "Classpath ve argümanlar diziliyor...")
                      val vObj = JSONObject(vJsonFile.readText())
                      val mainClass = vObj.getString("mainClass")
                      val assetIndex = vObj.optString("assets", "legacy")
                      val classpath = buildClasspath(versionId, vObj)

                      val nativeDir = File(context.applicationInfo.nativeLibraryDir)
                      val javaExec = File(nativeDir, "libjava_exec.so")
                      val bootClasspath = "${File(jreDir, "lib/resources.jar").absolutePath}:${File(jreDir, "lib/rt.jar").absolutePath}:${File(jreDir, "lib/jsse.jar").absolutePath}:${File(jreDir, "lib/jce.jar").absolutePath}:${File(jreDir, "lib/charsets.jar").absolutePath}"

                      onProgress(85, "JVM (${maxRamMb}MB RAM) ateşleniyor...")
                      val cmd = mutableListOf(
                          javaExec.absolutePath,
                          "-Xbootclasspath:$bootClasspath",
                          "-Xms512M",
                          "-Xmx${maxRamMb}M",
                          "-Djava.home=${jreDir.absolutePath}",
                          "-Djava.library.path=${nativeDir.absolutePath}:${nativesDir.absolutePath}:${jreDir.absolutePath}/lib/aarch64",
                          "-Djna.nosys=true",
                          "-cp", classpath,
                          mainClass,
                          "--username", username,
                          "--version", versionId,
                          "--gameDir", mcDir.absolutePath,
                          "--assetsDir", assetsDir.absolutePath,
                          "--assetIndex", assetIndex,
                          "--uuid", "00000000-0000-0000-0000-000000000000",
                          "--accessToken", "0",
                          "--userType", "legacy"
                      )

                      logger("Başlatılıyor: $mainClass (RAM: ${maxRamMb}MB)")
                      val pb = ProcessBuilder(cmd)
                      pb.directory(mcDir)
                      
                      val env = pb.environment()
                      env["HOME"] = mcDir.absolutePath
                      env["JAVA_HOME"] = jreDir.absolutePath
                      env["LD_LIBRARY_PATH"] = "${nativeDir.absolutePath}:${nativesDir.absolutePath}:${jreDir.absolutePath}/lib/aarch64:${jreDir.absolutePath}/lib/aarch64/jli:${jreDir.absolutePath}/lib/aarch64/server:/system/lib64"
                      env["LIBGL_ES"] = "2"
                      env["LIBGL_MIPMAP"] = "3"

                      pb.redirectErrorStream(true)
                      onProgress(100, "JVM Çalışıyor ($versionId)")
                      val process = pb.start()

                      process.inputStream.bufferedReader().useLines { lines ->
                          lines.forEach { logger("[JVM] $it") }
                      }
                      val exitCode = process.waitFor()
                      logger("JVM kapandı (Çıkış Kodu: $exitCode)")
                      onProgress(0, "Oyun Kapandı (Kod: $exitCode)")
                  } catch (e: Exception) {
                      logger("Başlatma Hatası: ${e.message}")
                      onProgress(0, "Başlatma Hatası!")
                  }
              }

              private fun fetchString(urlStr: String): String {
                  val conn = URL(urlStr).openConnection() as HttpURLConnection
                  conn.connectTimeout = 15000
                  return conn.inputStream.bufferedReader().readText()
              }

              private fun downloadFile(urlStr: String, dest: File) {
                  val conn = URL(urlStr).openConnection() as HttpURLConnection
                  conn.instanceFollowRedirects = true
                  conn.inputStream.use { input ->
                      FileOutputStream(dest).use { output ->
                          input.copyTo(output)
                      }
                  }
              }
          }
          EOF

          # 7. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/axera/launcher/MainActivity.kt
          package com.axera.launcher

          import android.app.Activity
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.os.Bundle
          import android.text.method.ScrollingMovementMethod
          import android.view.Gravity
          import android.widget.*
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var logView: TextView
              private lateinit var progressBar: ProgressBar
              private lateinit var statusLabel: TextView
              private lateinit var motor: CoreMotor
              private var selectedRamMb: Int = 1536

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  motor = CoreMotor(
                      context = this,
                      logger = { msg ->
                          runOnUiThread { logView.append("$msg\n") }
                      },
                      onProgress = { percent, status ->
                          runOnUiThread {
                              progressBar.progress = percent
                              statusLabel.text = "Durum: $status (%$percent)"
                          }
                      }
                  )

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(28, 24, 28, 24)
                  }

                  val leftScroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.1f).apply {
                          rightMargin = 24
                      }
                  }

                  val leftPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val title = TextView(this).apply {
                      text = "AXERA MOBILE"
                      textSize = 22f
                      setTextColor(Color.parseColor("#00E676"))
                  }

                  val userEdit = EditText(this).apply {
                      hint = "Kullanıcı Adı"
                      setText("Erdem")
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                  }

                  val versionSpinner = Spinner(this).apply {
                      val versions = arrayOf("1.8.9", "1.12.2", "1.16.5")
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, versions)
                  }

                  val minRam = 512
                  val maxRam = 2560
                  val ramLabel = TextView(this).apply {
                      text = "Ayrılan RAM: 1536 MB (1.5 GB)"
                      setTextColor(Color.parseColor("#64B5F6"))
                      setPadding(0, 12, 0, 4)
                  }

                  val ramSeekBar = SeekBar(this).apply {
                      max = maxRam - minRam
                      progress = selectedRamMb - minRam
                      progressTintList = ColorStateList.valueOf(Color.parseColor("#00E676"))
                      thumbTintList = ColorStateList.valueOf(Color.parseColor("#00E676"))
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              val rawRam = minRam + progress
                              selectedRamMb = (rawRam / 64) * 64
                              val gbText = String.format("%.2f", selectedRamMb / 1024f)
                              ramLabel.text = "Ayrılan RAM: $selectedRamMb MB ($gbText GB)"
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }

                  statusLabel = TextView(this).apply {
                      text = "Durum: Hazır (%0)"
                      setTextColor(Color.LTGRAY)
                      textSize = 13f
                      setPadding(0, 16, 0, 4)
                  }

                  progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      progress = 0
                      progressTintList = ColorStateList.valueOf(Color.parseColor("#00E676"))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          28
                      ).apply { bottomMargin = 16 }
                  }

                  val btnDownload = Button(this).apply {
                      text = "1. Sürümü ve Kütüphaneleri İndir"
                      setBackgroundColor(Color.parseColor("#1E88E5"))
                      setTextColor(Color.WHITE)
                  }

                  val btnLaunch = Button(this).apply {
                      text = "2. OYUNU BAŞLAT (ELF YAMALI JRE)"
                      setBackgroundColor(Color.parseColor("#00C853"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 12 }
                  }

                  leftPanel.apply {
                      addView(title)
                      addView(userEdit)
                      addView(versionSpinner)
                      addView(ramLabel)
                      addView(ramSeekBar)
                      addView(statusLabel)
                      addView(progressBar)
                      addView(btnDownload)
                      addView(btnLaunch)
                  }
                  leftScroll.addView(leftPanel)

                  logView = TextView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.4f)
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                      setTextColor(Color.parseColor("#00FF00"))
                      textSize = 11f
                      setPadding(16, 16, 16, 16)
                      gravity = Gravity.BOTTOM
                      movementMethod = ScrollingMovementMethod()
                      text = "[Axera Motoru v1.7 Hazır]\nELF Binary Yamalı (patchelf --replace-needed) JRE Aktif.\n"
                  }

                  rootLayout.addView(leftScroll)
                  rootLayout.addView(logView)
                  setContentView(rootLayout)

                  btnDownload.setOnClickListener {
                      val ver = versionSpinner.selectedItem.toString()
                      btnDownload.isEnabled = false
                      btnLaunch.isEnabled = false
                      thread {
                          motor.prepareVersion(ver)
                          runOnUiThread {
                              btnDownload.isEnabled = true
                              btnLaunch.isEnabled = true
                          }
                      }
                  }

                  btnLaunch.setOnClickListener {
                      val user = userEdit.text.toString().ifBlank { "Erdem" }
                      val ver = versionSpinner.selectedItem.toString()
                      btnLaunch.isEnabled = false
                      thread {
                          motor.launchGame(user, ver, selectedRamMb)
                          runOnUiThread { btnLaunch.isEnabled = true }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeraMobileLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
