name: Build Axera Mobile Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Project Structure & Code
        run: |
          mkdir -p app/src/main/java/com/axera/launcher
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AxeraMobile"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.axera.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId "com.axera.launcher"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1-Axera"
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              // Sifir harici bagimlilik! Saf Android SDK ve Kotlin.
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="Axera Launcher"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. CoreMotor.kt (Canlı İlerleme Çubuğu Destekli İndirme ve Başlatma Motoru)
          cat << 'EOF' > app/src/main/java/com/axera/launcher/CoreMotor.kt
          package com.axera.launcher

          import android.content.Context
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          class CoreMotor(
              private val context: Context,
              private val logger: (String) -> Unit,
              private val onProgress: (Int, String) -> Unit
          ) {

              val mcDir = File(context.filesDir, ".minecraft")
              val versionsDir = File(mcDir, "versions")
              val librariesDir = File(mcDir, "libraries")
              val assetsDir = File(mcDir, "assets")
              val nativesDir = File(mcDir, "natives")
              val jreDir = File(context.filesDir, "runtime/jre")

              init {
                  listOf(mcDir, versionsDir, librariesDir, assetsDir, nativesDir, jreDir).forEach {
                      if (!it.exists()) it.mkdirs()
                  }
              }

              // Mojang API'den sürüm verisini ve kütüphaneleri canlı yüzde ile indirir
              fun prepareVersion(versionId: String): Boolean {
                  return try {
                      onProgress(2, "Mojang manifest çekiliyor...")
                      logger("Mojang sunucularına bağlanılıyor ($versionId)...")
                      val manifestJson = fetchString("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
                      val versions = JSONObject(manifestJson).getJSONArray("versions")
                      
                      var versionUrl: String? = null
                      for (i in 0 until versions.length()) {
                          val v = versions.getJSONObject(i)
                          if (v.getString("id") == versionId) {
                              versionUrl = v.getString("url")
                              break
                          }
                      }

                      if (versionUrl == null) {
                          logger("HATA: Sürüm bulunamadı!")
                          onProgress(0, "Hata: Sürüm bulunamadı")
                          return false
                      }

                      onProgress(8, "$versionId JSON okunuyor...")
                      val vDir = File(versionsDir, versionId).apply { mkdirs() }
                      val vJsonFile = File(vDir, "$versionId.json")
                      val vJsonStr = fetchString(versionUrl)
                      vJsonFile.writeText(vJsonStr)

                      val vObj = JSONObject(vJsonStr)
                      
                      // Client.jar indir
                      val clientUrl = vObj.getJSONObject("downloads").getJSONObject("client").getString("url")
                      val clientJar = File(vDir, "$versionId.jar")
                      if (!clientJar.exists()) {
                          onProgress(15, "$versionId.jar indiriliyor...")
                          logger("$versionId.jar indiriliyor...")
                          downloadFile(clientUrl, clientJar)
                      } else {
                          onProgress(15, "$versionId.jar zaten mevcut.")
                      }

                      // İndirilecek geçerli kütüphaneleri filtrele (gerçekçi yüzde hesabı için)
                      val libs = vObj.getJSONArray("libraries")
                      val validLibs = mutableListOf<JSONObject>()
                      for (i in 0 until libs.length()) {
                          val lib = libs.getJSONObject(i)
                          if (!isLibAllowed(lib)) continue
                          val artifact = lib.optJSONObject("downloads")?.optJSONObject("artifact") ?: continue
                          validLibs.add(artifact)
                      }

                      val totalLibs = validLibs.size.coerceAtLeast(1)
                      var downloadedCount = 0

                      for ((index, artifact) in validLibs.withIndex()) {
                          val path = artifact.getString("path")
                          val url = artifact.getString("url")
                          val libFile = File(librariesDir, path)

                          // Yüzdeyi %15 ile %100 arasında oranla
                          val currentPercent = 15 + (((index + 1) * 85) / totalLibs)
                          onProgress(currentPercent, "Kütüphane (${index + 1}/$totalLibs): ${libFile.name}")

                          if (!libFile.exists()) {
                              libFile.parentFile?.mkdirs()
                              logger("İndiriliyor: ${libFile.name}")
                              downloadFile(url, libFile)
                              downloadedCount++
                          }
                      }

                      onProgress(100, "$versionId Hazır! ($downloadedCount yeni dosya)")
                      logger("Kurulum tamamlandı! Toplam $totalLibs kütüphane doğrulandı.")
                      true
                  } catch (e: Exception) {
                      logger("İndirme Hatası: ${e.message}")
                      onProgress(0, "İndirme Hatası!")
                      false
                  }
              }

              private fun isLibAllowed(lib: JSONObject): Boolean {
                  val rules = lib.optJSONArray("rules") ?: return true
                  var allow = false
                  for (i in 0 until rules.length()) {
                      val rule = rules.getJSONObject(i)
                      val action = rule.getString("action") == "allow"
                      val os = rule.optJSONObject("os")
                      if (os == null || os.optString("name") == "linux") {
                          allow = action
                      }
                  }
                  return allow
              }

              private fun buildClasspath(versionId: String, vObj: JSONObject): String {
                  val cp = StringBuilder()
                  val libs = vObj.getJSONArray("libraries")
                  for (i in 0 until libs.length()) {
                      val lib = libs.getJSONObject(i)
                      if (!isLibAllowed(lib)) continue
                      val artifact = lib.optJSONObject("downloads")?.optJSONObject("artifact") ?: continue
                      val libFile = File(librariesDir, artifact.getString("path"))
                      if (libFile.exists()) {
                          cp.append(libFile.absolutePath).append(":")
                      }
                  }
                  val clientJar = File(File(versionsDir, versionId), "$versionId.jar")
                  cp.append(clientJar.absolutePath)
                  return cp.toString()
              }

              // Oyunu canlı başlatma durumu ile tetikler
              fun launchGame(username: String, versionId: String, maxRamMb: Int) {
                  try {
                      onProgress(10, "Sürüm dosyaları kontrol ediliyor...")
                      val vJsonFile = File(File(versionsDir, versionId), "$versionId.json")
                      if (!vJsonFile.exists()) {
                          logger("Önce sürümü indirmelisin!")
                          onProgress(0, "Hata: Sürüm indirilmemiş!")
                          return
                      }

                      onProgress(30, "Classpath ve argümanlar diziliyor...")
                      val vObj = JSONObject(vJsonFile.readText())
                      val mainClass = vObj.getString("mainClass")
                      val assetIndex = vObj.optString("assets", "legacy")
                      val classpath = buildClasspath(versionId, vObj)

                      onProgress(55, "ARM64 JRE ve GL4ES kontrol ediliyor...")
                      val javaBin = File(jreDir, "bin/java")
                      if (!javaBin.exists()) {
                          logger("UYARI: ARM64 JRE bulunamadı (${javaBin.absolutePath}).")
                          logger("Classpath hazırlandı (${classpath.split(":").size} kütüphane).")
                          logger("Ayrılan RAM: ${maxRamMb}MB | Hedef: $mainClass")
                          onProgress(100, "Simülasyon Tamam (JRE Bekleniyor)")
                          return
                      } else {
                          javaBin.setExecutable(true)
                      }

                      onProgress(80, "JVM Parametreleri (${maxRamMb}MB RAM) hazırlanıyor...")
                      val cmd = mutableListOf(
                          javaBin.absolutePath,
                          "-Xms512M",
                          "-Xmx${maxRamMb}M",
                          "-XX:+UseG1GC",
                          "-XX:+ParallelRefProcEnabled",
                          "-XX:MaxGCPauseMillis=200",
                          "-Djava.library.path=${nativesDir.absolutePath}",
                          "-Dorg.lwjgl.opengl.libname=libgl4es_114.so",
                          "-cp", classpath,
                          mainClass,
                          "--username", username,
                          "--version", versionId,
                          "--gameDir", mcDir.absolutePath,
                          "--assetsDir", assetsDir.absolutePath,
                          "--assetIndex", assetIndex,
                          "--uuid", "00000000-0000-0000-0000-000000000000",
                          "--accessToken", "0",
                          "--userType", "legacy"
                      )

                      logger("Başlatılıyor: $mainClass (RAM: ${maxRamMb}MB)")
                      val pb = ProcessBuilder(cmd)
                      pb.directory(mcDir)
                      
                      val env = pb.environment()
                      env["HOME"] = mcDir.absolutePath
                      env["JAVA_HOME"] = jreDir.absolutePath
                      env["LD_LIBRARY_PATH"] = "${nativesDir.absolutePath}:${jreDir.absolutePath}/lib:${jreDir.absolutePath}/lib/jli"
                      env["LIBGL_ES"] = "2"
                      env["LIBGL_MIPMAP"] = "3"
                      env["LIBGL_NORMALIZE"] = "1"

                      pb.redirectErrorStream(true)
                      onProgress(100, "Oyun Çalışıyor ($versionId)")
                      val process = pb.start()

                      process.inputStream.bufferedReader().useLines { lines ->
                          lines.forEach { logger("[JVM] $it") }
                      }
                  } catch (e: Exception) {
                      logger("Çökme / Hata: ${e.message}")
                      onProgress(0, "Başlatma Hatası!")
                  }
              }

              private fun fetchString(urlStr: String): String {
                  val conn = URL(urlStr).openConnection() as HttpURLConnection
                  conn.connectTimeout = 10000
                  return conn.inputStream.bufferedReader().readText()
              }

              private fun downloadFile(urlStr: String, dest: File) {
                  val conn = URL(urlStr).openConnection() as HttpURLConnection
                  conn.inputStream.use { input ->
                      FileOutputStream(dest).use { output ->
                          input.copyTo(output)
                      }
                  }
              }
          }
          EOF

          # 7. MainActivity.kt (Canlı ProgressBar ve 1.5GB Varsayılan RAM Kaydırıcısı)
          cat << 'EOF' > app/src/main/java/com/axera/launcher/MainActivity.kt
          package com.axera.launcher

          import android.app.Activity
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.os.Bundle
          import android.text.method.ScrollingMovementMethod
          import android.view.Gravity
          import android.widget.*
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var logView: TextView
              private lateinit var progressBar: ProgressBar
              private lateinit var statusLabel: TextView
              private lateinit var motor: CoreMotor
              
              // Varsayılan RAM: 1536 MB (1.5 GB)
              private var selectedRamMb: Int = 1536

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  motor = CoreMotor(
                      context = this,
                      logger = { msg ->
                          runOnUiThread { logView.append("$msg\n") }
                      },
                      onProgress = { percent, status ->
                          runOnUiThread {
                              progressBar.progress = percent
                              statusLabel.text = "Durum: $status (%$percent)"
                          }
                      }
                  )

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(28, 24, 28, 24)
                  }

                  // Sol Kontrol Paneli (Kaydırılabilir yapı, küçük ekranlarda taşmayı önler)
                  val leftScroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.1f).apply {
                          rightMargin = 24
                      }
                  }

                  val leftPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val title = TextView(this).apply {
                      text = "AXERA MOBILE"
                      textSize = 22f
                      setTextColor(Color.parseColor("#00E676"))
                  }

                  val userEdit = EditText(this).apply {
                      hint = "Kullanıcı Adı"
                      setText("Erdem")
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                  }

                  val versionSpinner = Spinner(this).apply {
                      val versions = arrayOf("1.8.9", "1.12.2", "1.16.5", "1.20.4", "1.21.11")
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, versions)
                  }

                  // RAM Ayarlama Bölümü (512 MB - 2560 MB arası, Varsayılan: 1536 MB / 1.5 GB)
                  val minRam = 512
                  val maxRam = 2560
                  val ramLabel = TextView(this).apply {
                      text = "Ayrılan RAM: 1536 MB (1.5 GB)"
                      setTextColor(Color.parseColor("#64B5F6"))
                      setPadding(0, 12, 0, 4)
                  }

                  val ramSeekBar = SeekBar(this).apply {
                      max = maxRam - minRam
                      progress = selectedRamMb - minRam // 1536 - 512 = 1024
                      progressTintList = ColorStateList.valueOf(Color.parseColor("#00E676"))
                      thumbTintList = ColorStateList.valueOf(Color.parseColor("#00E676"))
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              // 64 MB katları şeklinde yuvarla
                              val rawRam = minRam + progress
                              selectedRamMb = (rawRam / 64) * 64
                              val gbText = String.format("%.2f", selectedRamMb / 1024f)
                              ramLabel.text = "Ayrılan RAM: $selectedRamMb MB ($gbText GB)"
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }

                  // Canlı Yüzde ve Durum Çubuğu Bölümü
                  statusLabel = TextView(this).apply {
                      text = "Durum: Hazır (%0)"
                      setTextColor(Color.LTGRAY)
                      textSize = 13f
                      setPadding(0, 16, 0, 4)
                  }

                  progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      progress = 0
                      progressTintList = ColorStateList.valueOf(Color.parseColor("#00E676"))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          28
                      ).apply { bottomMargin = 16 }
                  }

                  val btnDownload = Button(this).apply {
                      text = "1. Sürümü ve Kütüphaneleri İndir"
                      setBackgroundColor(Color.parseColor("#1E88E5"))
                      setTextColor(Color.WHITE)
                  }

                  val btnLaunch = Button(this).apply {
                      text = "2. OYUNU BAŞLAT (TEK OYUNCULU)"
                      setBackgroundColor(Color.parseColor("#00C853"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 12 }
                  }

                  leftPanel.apply {
                      addView(title)
                      addView(userEdit)
                      addView(versionSpinner)
                      addView(ramLabel)
                      addView(ramSeekBar)
                      addView(statusLabel)
                      addView(progressBar)
                      addView(btnDownload)
                      addView(btnLaunch)
                  }
                  leftScroll.addView(leftPanel)

                  // Sağ Konsol Paneli
                  logView = TextView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.4f)
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                      setTextColor(Color.parseColor("#00FF00"))
                      textSize = 12f
                      setPadding(16, 16, 16, 16)
                      gravity = Gravity.BOTTOM
                      movementMethod = ScrollingMovementMethod()
                      text = "[Axera Motoru v1.1 Hazır]\nVarsayılan RAM: 1536 MB (1.5 GB)\nHedef: ARM64 + GL4ES\n"
                  }

                  rootLayout.addView(leftScroll)
                  rootLayout.addView(logView)
                  setContentView(rootLayout)

                  // Buton Aksiyonları
                  btnDownload.setOnClickListener {
                      val ver = versionSpinner.selectedItem.toString()
                      btnDownload.isEnabled = false
                      btnLaunch.isEnabled = false
                      thread {
                          motor.prepareVersion(ver)
                          runOnUiThread {
                              btnDownload.isEnabled = true
                              btnLaunch.isEnabled = true
                          }
                      }
                  }

                  btnLaunch.setOnClickListener {
                      val user = userEdit.text.toString().ifBlank { "Erdem" }
                      val ver = versionSpinner.selectedItem.toString()
                      thread {
                          motor.launchGame(user, ver, selectedRamMb)
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeraMobileLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
